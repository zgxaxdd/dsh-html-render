name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev deps (eslint/globals for lint)
        run: npm ci --no-audit --no-fund

      - name: Renderer syntax
        run: node --check dsh-html-client.js

      - name: Bundle syntax (generated plugin halves)
        run: |
          node --check bundle/lib/client.js
          node --check bundle/lib/index.js

      - name: Installer syntax (node + powershell)
        run: |
          node --check install.mjs
          pwsh -NoProfile -Command '$t=$null; $e=$null; [System.Management.Automation.Language.Parser]::ParseFile("install-dsh-html.ps1", [ref]$t, [ref]$e) | Out-Null; if ($e.Count -gt 0) { $e | ForEach-Object { Write-Host $_.Message }; exit 1 } else { Write-Host "install-dsh-html.ps1 syntax OK" }'

      - name: Lint (no-undef catches A1-class scope bugs)
        run: npx eslint dsh-html-client.js install.mjs tools/*.mjs

      - name: Unit tests (pure functions from shipped source)
        run: node --test tools/test-unit.mjs

      - name: A1 static guard (mount naming)
        run: node tools/check-mount-refs.mjs

      - name: Version consistency (client ↔ CHANGELOG ↔ README)
        run: node tools/check-version.mjs

      - name: Vendor integrity (SHA256SUMS bidirectional + fonts)
        run: |
          test -f vendor/katex/VERSION
          test -f vendor/katex/LICENSE
          node tools/verify-sha256sums.mjs vendor/katex/SHA256SUMS vendor/katex
          n=$(ls vendor/katex/fonts/*.woff2 | wc -l)
          echo "katex fonts: $n woff2"
          test "$n" -ge 20
